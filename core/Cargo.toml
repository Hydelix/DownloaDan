[package]
name = "downloadan-core"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "DownloaDan download engine, queue manager and browser bridge (no UI)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = "0.8"
base64 = "0.22"
parking_lot = "0.12"
fs4 = "0.13"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1", "client"] }
